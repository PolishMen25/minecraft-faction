# Configuration des alertes et des sauvegardes hors site (lu par mc-alert, mc-watch, mc-backup-offsite).
# Installé dans /etc/minecraft-faction.conf ; install.sh ne l'écrase jamais.

# Alertes Discord : URL d'un webhook (salon Discord > Modifier le salon > Intégrations > Webhooks).
# Vide = les alertes vont seulement dans le journal système (journalctl -t minecraft-faction).
DISCORD_WEBHOOK=""

# Sauvegardes hors site : dossier sur un AUTRE disque ou une autre machine, monté dans le conteneur
# (point de montage Proxmox « pct set 200 -mp0 /chemin/hote,mp=/mnt/offsite », NFS, SMB...).
# Vide = désactivé. Chaque sauvegarde quotidienne y est copiée puis vérifiée.
OFFSITE_DIR=""
OFFSITE_KEEP=7

# Seuils de mc-watch (vérification toutes les 5 minutes)
DISK_ALERT_PCT=85
BACKUP_MAX_AGE_HOURS=26
