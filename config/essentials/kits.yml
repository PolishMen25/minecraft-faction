# Kits du serveur Faction, copiés par install.sh à la première installation.
# Délai en secondes (-1 : une seule fois). "starter" est donné automatiquement à la première connexion
# (newbies.kit dans config.yml), les autres via /kit <nom> avec la permission essentials.kits.<nom>.
kits:
  starter:
    delay: -1
    items:
      - stone_sword 1
      - stone_pickaxe 1
      - stone_axe 1
      - stone_shovel 1
      - leather_helmet 1
      - leather_chestplate 1
      - leather_leggings 1
      - leather_boots 1
      - cooked_beef 16
      - torch 16
      - oak_log 16
  pvp:
    delay: 43200
    items:
      - iron_helmet 1
      - iron_chestplate 1
      - iron_leggings 1
      - iron_boots 1
      - iron_sword 1
      - bow 1
      - arrow 32
      - golden_apple 2
  quotidien:
    delay: 86400
    items:
      - cooked_beef 16
      - bread 16
      - golden_carrot 4
  vip:
    delay: 172800
    items:
      - iron_sword 1
      - iron_pickaxe 1 efficiency:2
      - golden_apple 4
      - experience_bottle 16
