# LifeShop : boutique en menus (/shop). Tout est configurable ici ; /shop reload recharge le fichier.
#
# RÈGLES DE COHÉRENCE (vérifiées au chargement, tout objet fautif est ignoré et signalé dans la console) :
#   1. prix d'achat (buy) STRICTEMENT supérieur au prix de vente (sell), sinon boucle d'argent infinie ;
#   2. anti-boucle PNJ : voir la section « anti-boucle » plus bas.
# Les prix de vente (sell) des objets présents dans plugins/Essentials/worth.yml sont ÉGAUX à ceux de /sell.
# Si tu modifies worth.yml, reporte les changements ici (et inversement). Les autres objets ont
# un prix de vente d'environ 25 % de l'achat. Sans « sell » (ou sell: 0), l'objet est achetable mais pas vendable.
# Les objets custom (tag PDC, nom ou lore personnalisé, enchantements) ne sont jamais vendables ici.

# --- Menu principal ---
menu:
  titre: "&8Boutique"
  lignes: 4              # 1 à 6
  remplissage: BLACK_STAINED_GLASS_PANE   # vitre de décor (AIR pour désactiver)
  slot-solde: 31         # emplacement de l'indicateur de solde (-1 pour masquer)
  titre-categorie: "&8Boutique : {categorie} &7({page}/{pages})"

# --- Son (nom du son Bukkit/Minecraft, ex. ENTITY_EXPERIENCE_ORB_PICKUP ; vide pour couper) ---
sons:
  succes: ENTITY_EXPERIENCE_ORB_PICKUP
  erreur: ENTITY_VILLAGER_NO
  navigation: UI_BUTTON_CLICK

# --- Textes de l'item (placeholders : {achat} {vente} {pile}) ---
lore:
  achat: "&7Achat : &a{achat}"
  vente: "&7Vente : &c{vente}"
  non-vendable: "&7Vente : &8non vendable"
  aide:
    - ""
    - "&eClic gauche &7: acheter 1"
    - "&eShift + clic gauche &7: acheter {pile}"
    - "&eClic droit &7: vendre 1"
    - "&eShift + clic droit &7: tout vendre"

# --- Messages (placeholders : {objet} {quantite} {montant} {solde} {demande}) ---
messages:
  prefixe: "&6[Boutique] &r"
  achat-ok: "&aAchat : &f{quantite}x {objet} &apour &f{montant}&a."
  achat-partiel: "&7Inventaire presque plein : {quantite} au lieu de {demande}."
  vente-ok: "&aVente : &f{quantite}x {objet} &apour &f{montant}&a."
  pas-assez-argent: "&cIl te faut {montant} (solde : {solde})."
  inventaire-plein: "&cTon inventaire est plein."
  rien-a-vendre: "&cTu n'as aucun {objet} vendable (les objets nommés ou custom sont refusés)."
  non-vendable: "&cCet objet n'est pas vendable."
  economie-absente: "&cL'économie est indisponible."
  erreur-economie: "&cTransaction refusée par l'économie, rien n'a été débité."
  reload-ok: "&aConfiguration rechargée ({objets} objets, {ignores} ignorés)."
  pas-permission: "&cTu n'as pas la permission."
  joueur-seulement: "Commande réservée aux joueurs."
  categorie-inconnue: "&cCatégorie inconnue."

# --- Anti-boucle PNJ ---
# Les villageois du spawn donnent 1 émeraude contre N objets (voir MERCHANTS dans
# spawn/generate_spawn_districts.py), et 1 émeraude permet d'acheter des objets revendables
# jusqu'à « valeur-emeraude » $ via /sell (ex. 6 pains à 30 $). Si la boutique vendait ces objets trop
# peu cher, on pourrait les acheter ici, les donner au PNJ, puis revendre le résultat.
# Règle : prix d'achat unitaire x quantité >= marge x valeur-emeraude, sinon l'objet est ignoré.
# Pour ne pas se compliquer la vie, plusieurs de ces objets ne sont simplement pas en boutique.
# À tenir à jour avec les échanges des PNJ et worth.yml.
anti-boucle:
  valeur-emeraude: 180
  marge: 1.2
  quantite-pour-1-emeraude:
    IRON_INGOT: 6
    CHICKEN: 14
    PORKCHOP: 7
    COAL: 16
    CLAY_BALL: 10
    WHEAT: 20
    CARROT: 16
    ROTTEN_FLESH: 32
    PAPER: 24
