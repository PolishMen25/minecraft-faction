name: LifeKoth

on:
  push:
    branches: [main]
    paths: ['plugins/koth/**', '.github/workflows/koth.yml']
  pull_request:
    paths: ['plugins/koth/**', '.github/workflows/koth.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compiler le plugin
        run: mvn -B package --file plugins/koth/pom.xml
      - uses: actions/upload-artifact@v4
        with:
          name: LifeKoth
          path: plugins/koth/target/LifeKoth-*.jar
      # Sur main : publie une release, que install.sh télécharge comme les autres plugins
      - name: Publier la release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "koth-${{ github.run_number }}" plugins/koth/target/LifeKoth-*.jar \
            --title "LifeKoth build ${{ github.run_number }}" \
            --notes "Plugin KOTH compilé automatiquement depuis ${{ github.sha }}." --latest
