name: LifeCore

on:
  push:
    branches: [main]
    paths: ['plugins/core/**', '.github/workflows/core.yml']
  pull_request:
    paths: ['plugins/core/**', '.github/workflows/core.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compiler le plugin
        run: mvn -B package --file plugins/core/pom.xml
      - uses: actions/upload-artifact@v4
        with:
          name: LifeCore
          path: plugins/core/target/LifeCore-*.jar
      # Sur main : publie une release, que install.sh télécharge comme les autres plugins
      - name: Publier la release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "core-${{ github.run_number }}" plugins/core/target/LifeCore-*.jar \
            --title "LifeCore build ${{ github.run_number }}" \
            --notes "Plugin LifeCore compilé automatiquement depuis ${{ github.sha }}."
